#:schema https://json.schemastore.org/any.json

# 与 Taskfile.yml 的 dotenv 规则保持一致：.env 优先，缺失变量回落 .env.example；
# 文件不存在时 air 仅记录警告并继续（已实测验证）。
env_files = [".env", ".env.example"]
root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  args_bin = []
  # 入口是 cmd/app，不能用默认的 "."（根目录没有 Go 文件，构建必失败）。
  # 不带 CGO_ENABLED=0 前缀：air 在 Windows 上经 PowerShell 执行 cmd，POSIX 的 env 前缀语法会报错。
  # -tags migrate 与 `task run`（go run -tags migrate ./cmd/app）一致：应用启动时自动应用迁移。
  cmd = "go build -tags migrate -o ./tmp/main.exe ./cmd/app"
  delay = 1000
  # v1.64.5 起 bin 已废弃（会打印 deprecation 警告），用 entrypoint 替代。
  entrypoint = ["tmp\\main.exe"]
  exclude_dir = ["assets", "tmp", "vendor", "testdata"]
  exclude_file = []
  exclude_regex = ["_test.go"]
  exclude_unchanged = false
  follow_symlink = false
  full_bin = ""
  ignore_dangerous_root_dir = false
  include_dir = []
  include_ext = ["go", "tpl", "tmpl", "html"]
  include_file = []
  kill_delay = "0s"
  log = "build-errors.log"
  poll = false
  poll_interval = 0
  post_cmd = []
  pre_cmd = []
  rerun = false
  rerun_delay = 500
  send_interrupt = false
  stop_on_error = false

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  silent = false
  time = false

[misc]
  clean_on_exit = false

[proxy]
  app_port = 0
  app_start_timeout = 0
  enabled = false
  proxy_port = 0

[screen]
  clear_on_rebuild = false
  keep_scroll = true
